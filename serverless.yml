service: api-generic-llm
frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.14
  timeout: 25
  memorySize: 512
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    GROQ_MODEL: "openai/gpt-oss-120b"

functions:
  consulta_texto:
    handler: consulta_texto.lambda_handler
    events:
      - http:
          method: post
          path: /api-generic-llm/consulta_texto
          cors: true
          integration: lambda
  consulta_s3:
    handler: consulta_s3.lambda_handler
    events:
      - http:
          method: post
          path: /api-generic-llm/consulta_s3
          cors: true
          integration: lambda